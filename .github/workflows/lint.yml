name: Lint

on:
  push:
  pull_request:

jobs:
  web-ext-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint the extension
        run: npx --yes web-ext@8 lint --source-dir extension
